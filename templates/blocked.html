<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account Blocked - FraudShield AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            font-family: 'Segoe UI', sans-serif;
        }

        .blocked-card {
            width: 90%;
            max-width: 550px;
            background: white;
            padding: 45px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.12);
        }

        .blocked-icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        .blocked-card h1 {
            color: #dc3545;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .blocked-card p {
            color: #64748b;
            line-height: 1.7;
        }

        .logout-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #0f172a;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #1e293b;
            color: white;
        }

    </style>

</head>

<body>

    <div class="blocked-card">

        <div class="blocked-icon">
            🚨
        </div>

        <h1>Account Blocked</h1>

        <p>
            FraudShield AI detected a potentially fraudulent
            transaction associated with your account.
        </p>

        <p>
            For your security, access to the system has been
            temporarily blocked.
        </p>

        <p>
            Please contact the administrator or your bank/card
            issuer for further assistance.
        </p>

        <a href="/logout" class="logout-btn">
            Logout
        </a>

    </div>

</body>

</html>
