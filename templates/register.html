<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<style>

body{

    min-height:100vh;
    background:linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;

}


.register-card{

    width:420px;
    padding:35px;
    background:white;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);

}


.logo{

    text-align:center;
    font-size:50px;

}


.title{

    font-weight:700;

}


.form-control{

    height:45px;
    border-radius:10px;

}


.register-btn{

    height:45px;
    border-radius:25px;
    font-weight:bold;

}

</style>

</head>


<body>


<div class="register-card">


<div class="logo">
💳
</div>


<h2 class="text-center title">

Create Account

</h2>


<p class="text-center text-muted">

Join AI Fraud Detection System

</p>



<form method="POST" action="/register">


<div class="mb-3">

<label class="form-label">
Name
</label>

<input 
type="text"
name="name"
class="form-control"
placeholder="Enter your name"
required>

</div>

<div class="mb-3">

<label class="form-label">
Email
</label>

<input 
type="email"
name="email"
class="form-control"
placeholder="Enter your email"
required>

</div>



<div class="mb-3">

<label class="form-label">
Password
</label>

<input 
type="password"
name="password"
class="form-control"
placeholder="Create password"
required>

</div>



<button 
class="btn btn-primary w-100 register-btn">

Create Account

</button>


</form>


<p class="text-center mt-4">

Already have an account?

<a href="/login">
Login
</a>

</p>


</div>


</body>

</html>
